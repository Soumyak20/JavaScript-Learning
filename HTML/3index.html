<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myntra Layout</title>

<style>
body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 30px;
    border-bottom: 1px solid white;

}

nav {
    background-color: #f8b195;
    padding: 10px;
    text-align: center;
}
main {
    flex: 1;  
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
footer {
    background-color: #f5f5f5;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
}

</style>
</head>
<body>

<header>
    myntra
</header>

<nav> 
   <span>home</span>
   <span>product</span>
   <span>mens</span>
   <span>womens
   <span>beauty</span>
   </span>
</nav>


<main>
    <img src="assets/myntra ads.jpg" alt="Myntra Image">
    <figcaption>myntra</figcaption>
</main>

<footer>
    © 2026
</footer>

</body>
</html>
