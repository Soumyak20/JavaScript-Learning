<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            font-family: Arial;
        }

        .container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 48%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }
       
    </style>
</head>

<body>

<div class="container">
    <h2>Survey Form</h2>

    <form>

        <!-- Name -->
        <label>Name</label>
        <input type="text" required>

        <!-- Email -->
        <label>Email</label>
        <input type="email" required>

        <!-- Dropdown -->
        <label>Favorite Subject</label>
        <select>
            <option>Math</option>
            <option>Science</option>
            <option>Computer</option>
        </select>

        <!-- Checkbox -->
        <label>Skills you learned</label><br>
        <input type="checkbox"> HTML
        <input type="checkbox"> CSS
        <input type="checkbox"> JavaScript
        <br><br>

        <!-- Textarea -->
        <label>Feedback</label>
        <textarea rows="3"></textarea>

        <!-- Buttons -->
        <div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>
</div>

</body>
</html>
