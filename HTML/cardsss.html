<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Card</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            height: 600px;
            padding: 20px;
        }

        .cards {
            width: 280px;
            border: 1px solid black;
            text-align: center;
            background-color: white;
            margin-right: 10px;
            
        }
        .cardHead {
            background-color: blueviolet;
            color: white;
            padding: 10px;
        }

        .cardBody {
            font-size: 18px;
            color: lightseagreen;
            padding: 10px;
        }

        .cardBody img {
            width: 100%;
            height: 200px;
        }

        .cardFooter {
            padding: 10px;
        }

        .cardFooter button {
            width: 100%;
            color: white;
            background-color: blueviolet;
        }

        .cardFooter button:hover {
            background-color: yellow;
            color: black;
            border: 1px solid black;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Card 1 -->
    <div class="cards">
        <div class="cardHead">
            <h1>Shirt</h1>
        </div>
        <div class="cardBody">
            <img src="assets/shirt.jpg" alt="shirt">
            <p>
                <span class="bi bi-currency-rupee"></span> 499/-
            </p>
        </div>
        <div class="cardFooter">
            <button>
                <span class="bi bi-cart4"></span> Buy
            </button>
        </div>
    </div>

    <!-- Card 2 -->
    <div class="cards">
        <div class="cardHead">
            <h1>Watch</h1>
        </div>
        <div class="cardBody">
            <img src="assets/watch.jpg" alt="watch">
            <p>
                <span class="bi bi-currency-rupee"></span> 499/-
            </p>
        </div>
        <div class="cardFooter">
            <button>
                <span class="bi bi-cart4"></span> Buy
            </button>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="cards">
        <div class="cardHead">
            <h1>Shoes</h1>
        </div>
        <div class="cardBody">
            <img src="assets/shoes.jpg" alt="shoes">
            <p>
                <span class="bi bi-currency-rupee"></span> 499/-
            </p>
        </div>
        <div class="cardFooter">
            <button>
                <span class="bi bi-cart4"></span> Buy
            </button>
        </div>
    </div>

    <!-- Card 4 -->
    <div class="cards">
        <div class="cardHead">
            <h1>Flipkart</h1>
        </div>
        <div class="cardBody">
            <img src="assets/flipcart.png" alt="flipkart">
            <p>
                <span class="bi bi-currency-rupee"></span> 499/-
            </p>
        </div>
        <div class="cardFooter">
            <button>
                <span class="bi bi-cart4"></span> Buy
            </button>
        </div>
    </div>

</div>

</body>
</html>
