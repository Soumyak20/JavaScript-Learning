<!DOCTYPE html>
<html lang="en">
<head>

<title>Student Table</title>
</head>

    </tr>

        <td>Id</td>
        <td>Name</td>
        <td>Department</td>

        <td>12345</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Williams</td>
        <td>Electronics</td>
        <td>23456</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Harry</td>
        <td>Electrical</td>
        <td>34567</td>
    </tr>
    <tr>
        <td>4</td>
        <td>Rick</td>

    </tr>
</table>

</body>
</html>
