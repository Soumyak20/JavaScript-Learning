<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart</title>
    <style>
        body { 
            margin: 0; 
        }
        header {
            background-color: yellow;
            color: blue;
            text-align: center;
            padding: 15px;
            font-size: 40px;
            font-weight: bold;
        }
        section {
            display: grid;
            grid-template-columns: 1fr 3fr;
            height: 630px;
            
        }
        aside {
            background-color: lightgray;
            padding: 20px;
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
        }
        footer {
            background-color: yellow;
            color: blue;
            font-size: 20px;
            text-align: center;
            padding: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>Flipkart</header>
    <section>
        <aside>Categories</aside>
        <main>
            <figure>
                <img src="assets/image.jpg" alt="nature image">
                <figcaption>flipcart</figcaption>
            </figure>
        </main>
    </section>
    <footer>&copy; 2026</footer>
</body>
</html>
