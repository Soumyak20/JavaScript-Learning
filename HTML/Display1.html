<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display grid prop</title>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        header, footer {
            background-color: lightcoral;
            text-align: center;
            padding: 10px;
            height: 50px;
        }
        section {
            height: 550px;
 
            display: grid;
            grid-template-columns: 3fr 6fr 3fr;
 
        }
        header {
            grid-row: 1;
            grid-column: 1/4;
 
        }
        section {
            grid-row: 2;
            grid-column: 1/4;
 
        }
        footer {
            grid-row: 3;
            grid-column: 1/4;
        }
    </style>
</head>
<body>
   
    <div class="container">
        <header>
            ONline Shopping Website
        </header>
        <section>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Footwear</li>
                </ul>
            </nav>
            <main>
                <img src="../../images/gift1.jpg" height="150px" width="150px" alt="">
                <p>Lorem ipsum dolor sit amet.</p>
            </main>
            <aside>
                offer offer offer
            </aside>
        </section>
        <footer>
             &copy; copyright @2026
        </footer>
 
    </div>
</body>
</html>
