<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <style>
        body{
            padding: 0px;
            margin: 10px;
           
            
            justify-content: center;  
           
            background-color: white
            /* display: flex; */
                    
        }
        form{
            background-color: antiquewhite;
            /* padding: 10px; */
             border: 1px solid black;
              width: 500px;
              align-items: center;
              /* display: flex; */

            
        }
        h2{
            background-color: blueviolet;
            text-align: center;
            padding: 10px;
            margin-top: 0px;
        }
        .content {
            padding: 10px;
        }
    </style >
</head>
<body>



<form method="get">
    <h2 align="center" >Student Registration Form </h2>

   <div class="content">
     <!-- Name -->
    <label>Full Name:</label><br>
    <input type="text" name="fullname" placeholder="Enter your name" required><br><br>

    <!-- Email -->
    <label>Email:</label><br>
    <input type="email" name="email" placeholder="Enter your email" required><br><br>

    <!-- Password -->
    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <!-- Mobile -->
    <label>Mobile Number:</label><br>
    <input type="text" name="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required><br><br>

    <!-- Gender -->
    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female<br><br>

    <!-- Courses -->
    <label>Select Course:</label><br>
    <select name="course">
        <option value="">--Select--</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="js">JavaScript</option>
    </select><br><br>

    <!-- Skills -->
    <label>Skills:</label><br>
    <input type="checkbox" name="skills" value="HTML"> HTML
    <input type="checkbox" name="skills" value="CSS"> CSS
    <input type="checkbox" name="skills" value="JS"> JavaScript<br><br>

    <!-- Date -->
    <label>Date of Birth:</label><br>
    <input type="date" name="dob"><br><br>

    <!-- Address -->
    <label>Address:</label><br>
    <textarea rows="4" cols="40" name="address"></textarea><br><br>

    <!-- Buttons -->
    <button type="submit">Register</button>
    <button type="reset">Reset</button> 
   </div>

</form>

</body>
</html>
