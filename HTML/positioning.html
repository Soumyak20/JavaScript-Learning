<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .box {
  width: 150px;
  height: 100px;
  background: black;
}
.box {
  width: 150px;
  height: 100px;
  background: blue;
  position: relative;
  top: 20px;
  left: 20px;
}
.parent {
  width: 200px;
  height: 150px;
  background: lightgray;
  position: relative;
}

.child {
  width: 80px;
  height: 50px;
  background: red;
  position: absolute;
  top: 0;
  right: 0;
}
.box {
  width: 100px;
  height: 50px;
  background: green;
  position: fixed;
  bottom: 10px;
  right: 10px;
}
.box {
  background: orange;
  padding: 10px;
  position: sticky;
  top: 0;
}


    </style>
</head>
<body>
    <div class="box">Static Box</div>

    <div class="box">Relative Box</div>
    <div class="parent">

  <div class="child">Absolute</div>
</div>

<div class="box">Fixed</div>

<div class="box">Sticky</div>
<div style="height:1000px;"></div>


</body>
</html>
