<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card demo</title>
        <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <style>
        .container {
            display: flex;

        }
        .cards {
            width: 300px;
            border: 1px solid black;
            text-align: center;
            margin: 0 10px;
            border-radius: 10px;

        }

        .cardHead {
            background-color: chocolate;
            color: white;
            border: 1px solid black;
            border-radius: 10px;            
        }
        .cardBody {
            font-size: 20px;
            color: chocolate;
          }
          .cardFooter {
            /* background-color: chocolate; */
            color: white;
        

          }
          .cardFooter button {
            width: 100%;
            padding: 10px;
            font-size: 21px;
            color: chocolate;
            border: none;
            border-radius: 10px;
          }
           button:hover {
            background-color: lightsalmon;
            color: white;
            border: 1px solid chocolate;
        
           }
    </style>
</head>

<body>

    <div class="container">
        <div class="cards">
            <div class="cardHead">
                <h1><span></span> Sunscreen SPF50++</h1>
            <!-- <header>  Sunscreen SPF50++</header> -->
            </div>
            <div class="cardBody">
                <img src="../images/sunscreen.png" width="100%" height="200px" alt="">
                <p>
                    <span class="bi bi-currency-rupee"></span> 499/-
                </p>
            </div>
            <div class="cardFooter">
                <button> 
                     <span class="bi bi-cart4"></span> Add to cart
                </button>
            </div>

        </div>

         <div class="cards">
            <div class="cardHead">
                <h1><span></span>Iqoo Neo</h1>
            </div>
            <div class="cardBody">
                <img src="../images/sunscreen.png" width="100%" height="200px" alt="">
                <p>
                    <span class="bi bi-currency-rupee"></span> 49,999/-
                </p>
            </div>
            <div class="cardFooter">
                <button> 
                     <span class="bi bi-cart4"></span> Add to cart
                </button>
            </div>

        </div>

         <div class="cards">
            <div class="cardHead">
                <h1><span></span> Samsung Galaxy</h1>
            </div>
            <div class="cardBody">
                <img src="../images/image.png" width="100%" height="200px" alt="">
                <p>
                    <span class="bi bi-currency-rupee"></span> 65,900/-
                </p>
            </div>
            <div class="cardFooter">
                <button> 
                     <span class="bi bi-cart4"></span> Add to cart
                </button>
            </div>

        </div>

         <div class="cards">
            <div class="cardHead">
                <h1><span></span> Iphone 17</h1>
            </div>
            <div class="cardBody">
                <img src="../images/sunscreen.png" width="100%" height="200px" alt="">
                <p>
                    <span class="bi bi-currency-rupee"></span> 49,999/-
                </p>
            </div>
            <div class="cardFooter">
                <button> 
                     <span class="bi bi-cart4"></span> Add to cart
                </button>
            </div>

        </div>
    </div>

</body>

</html>
