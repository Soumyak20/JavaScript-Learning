<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon</title>

<style>

header {
    /* border: 5px solid black; */
    background-color: yellow;
    padding: 10px;
    text-align: center;
}
section {
    display: grid;
    grid-template-columns: 3fr 8fr 3fr;
    height: 590px;
    /* border: 5px solid black; */
}


aside {
    /* border: 5px solid blueviolet; */
    background-color: pink;
    padding: 20px;
    text-align: left;
}

aside {
    text-align: center;
}

main {
    /* border: 5px solid green; */
    background-color: lightgreen;
    padding: 20px;
    text-align: center;
}


.ads {
    /* border: 5px solid blue; */
    background-color: aqua;
    padding: 10px;
    text-align: center;
}

image {
    max-width: 100%;
    height: auto;
}

figure {
    margin: 0;
}

footer {
    background-color: gray;
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<header>
    <h2>Amazon</h2>
</header>

<section>

    <aside>
        <h3>Menu</h3>
    </aside>

    <main>
        <figure>
            <img src="assets/image.jpg" height="550px" alt="nature image">
            <figcaption>Nature Image</figcaption>
        </figure>
    </main>

    <div class="ads">
        <div class="ad-box">Cart Item 1</div>
    </div>

</section>

<footer>
    <p>&copy; 2026 Online Shopping</p>
</footer>

</body>

</html>
