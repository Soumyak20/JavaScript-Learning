<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>

    <style>
        header {
            border: 5px solid red;
            background-color: lightgreen;
            padding: 10px;
            text-align: center;
        }
        section{
            height: 500px;
            display: grid;
            grid-template-columns: 3fr 8fr 3fr;
            text-align: center;
            
        }

        section {
            border: 5px solid black;
            text-align: center; 
        }
        aside {
            border: 5px solid blueviolet;
            background-color: pink;
            padding: 100px;
            font-size: 20px;
            font-weight: 600px;
            text-align: center;

        }

        main {
           border: 5px solid green;
           background-color: lightgreen;
           padding: 30px;
           text-align: center;   
        }

        .ad-box {
            border: 5px solid blue;
            background-color: aqua;
            height: 250px;
            
        }
        img {
            max-width: 100%;
            height: auto;
        }

        footer {
            border: 5px solid red;
            background-color: gray;
            text-align: center;
            padding: 20px;
        }

    </style>
</head>

<body>

    <header>
        <h2>Online Shopping</h2>
    </header>

    <section>

        <aside>
            Aside
        </aside>

        <main>
            <figure>
                <img src="assets/image.jpg" alt="nature image">
                <figcaption>Nature Image</figcaption>
            </figure>
        </main>

        <div class="ads">
            <div class="ad-box">Ads here</div>
            <div class="ad-box">Ads here</div>
        </div>

    </section>  

    <footer>
        <p>&copy;</p>
    </footer>

</body>

</html>
