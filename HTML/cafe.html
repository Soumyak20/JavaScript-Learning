<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cafe Landing Page</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: brown
}

.container {
    padding: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.card {
    background: #f7e7d7;
    width: 800px;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    
}
.navbar {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 15px;
}

.navbar a {
    text-decoration: none;
    color: #555;
}
h1 {
    font-size: 28px;
}

p {
    color: black;
}
.button {
    background: #ff4dc4;
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    margin-top: 10px;
}

.cake {
    text-align: center;
}

.cake img {
    width: 120px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- Navbar -->
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">Opening</a>
            <a href="#">Desserts</a>
            <a href="#">Contacts</a>
            
        </div>

        <!-- Content -->
        <h1>Healthy Desserts in<br> Our New Cafe</h1>

        <p>No sugar, no flour only natural ingredients.<br>
        Taste the best healthy desserts!</p>


        <div class="cake">
            <img src="assets/icon coffe.png">
            <p>coffee</p>
            </div>

            <div class="cake">
            <img src="assets/choc cake.jpg">
            <p>Chocolate Cake</p>
            </div>

            <div class="cake">
            <img src="assets/Burgerr.jpg">
            <p>Burger</p>
            </div>

        <button class="button">Book Now</button>

    </div>

</div>

</body>
</html>
